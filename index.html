<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Tập san lớp 6A8 - Trường Huỳnh Khương Ninh</title>
  <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    .container {
      padding: 0;
    }
  </style>


  <!-- Flipbook StyleSheet -->
  <link href="./dflip/css/dflip.min.css" rel="stylesheet" type="text/css">

  <!-- Icons Stylesheet -->
  <link href="./dflip/css/themify-icons.min.css" rel="stylesheet" type="text/css">

</head>

<body>

  <div class="container">

    <div class="row">
      <div class="col-xs-12" style="padding-bottom:0">
        <!--Normal FLipbook-->
        <div class="_df_book" width="100%" height="100vh" webgl="true" backgroundcolor="teal" source="./tapsan6a8.pdf"
          id="df_manual_book">
        </div>

      </div>
    </div>
  </div>

  <!-- Nhạc nền: đổi src thành đường dẫn file nhạc của bạn (ví dụ ./music.mp3) -->
  <audio id="bgm" src="./music.mp3" loop autoplay muted></audio>

  <!-- jQuery  -->
  <script src="./dflip/js/libs/jquery.min.js" type="text/javascript"></script>
  <!-- Flipbook main Js file -->
  <script src="./dflip/js/dflip.min.js" type="text/javascript"></script>
  <!-- Kích hoạt phát nhạc sau tương tác người dùng do chính sách autoplay của trình duyệt -->
  <script type="text/javascript">
    (function () {
      var audio = document.getElementById('bgm');
      if (!audio) return;

      function tryPlay() {
        try {
          audio.muted = false;
          var p = audio.play();
          if (p && typeof p.then === 'function') {
            p.catch(function () { /* bỏ qua lỗi autoplay */ });
          }
        } catch (e) { /* bỏ qua */ }

        window.removeEventListener('click', tryPlay);
        window.removeEventListener('touchstart', tryPlay);
        window.removeEventListener('keydown', tryPlay);
      }

      window.addEventListener('click', tryPlay, { once: true });
      window.addEventListener('touchstart', tryPlay, { once: true });
      window.addEventListener('keydown', tryPlay, { once: true });
    })();
  </script>

</body>

</html>
